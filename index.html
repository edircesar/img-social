<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload para Supabase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons para ícones modernos -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <!-- Navegação de Abas -->
        <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="upload-tab">
                <i class="ph ph-upload-simple"></i> Enviar
            </button>
            <button class="tab-btn" data-tab="gallery-tab">
                <i class="ph ph-images"></i> Galeria
            </button>
        </nav>

        <!-- ABA DE UPLOAD -->
        <section id="upload-tab" class="tab-content active">
            <header class="header">
                <div class="icon-container">
                    <i class="ph ph-cloud-arrow-up"></i>
                </div>
                <h1>Image Upload</h1>
                <p>Envie suas imagens para o Supabase</p>
            </header>

            <form id="uploadForm" class="upload-form">
                
                <div class="file-upload-wrapper" id="dropZone">
                    <input type="file" id="imageInput" name="image" accept=".jpg, .jpeg, .png, .webp" required>
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <i class="ph ph-image"></i>
                        <p><strong>Clique para selecionar</strong> ou arraste uma imagem</p>
                        <span>JPG, PNG ou WEBP (Max. 5MB)</span>
                    </div>
                    <div class="image-preview hidden" id="imagePreviewContainer">
                        <img id="imagePreview" src="" alt="Preview">
                        <button type="button" class="btn-remove" id="btnRemoveFile" title="Remover imagem">
                            <i class="ph ph-x"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="description">Descrição da Imagem (Opcional)</label>
                    <input type="text" id="description" name="description" placeholder="Ex: Foto de perfil, Post do Instagram...">
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <i class="ph ph-upload-simple"></i>
                    Fazer Upload
                </button>
            </form>

            <!-- Área de Loading / Progresso -->
            <div class="progress-container hidden" id="progressContainer">
                <div class="loader">
                    <i class="ph ph-spinner-gap spin"></i>
                    <span id="progressText">Enviando...</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Área de Resultado (Logo após o upload) -->
            <div class="result-container hidden" id="resultContainer">
                <div class="result-card">
                    <div class="success-header">
                        <div class="success-icon">
                            <i class="ph ph-check-circle"></i>
                        </div>
                        <h2>Upload Concluído!</h2>
                    </div>
                    
                    <button type="button" class="btn-new-upload" id="btnNewUpload">
                        Enviar nova imagem
                    </button>
                    <button type="button" class="btn-submit" id="btnViewGallery">
                        Ver na Galeria
                    </button>
                </div>
            </div>
        </section>

        <!-- ABA DE GALERIA -->
        <section id="gallery-tab" class="tab-content hidden">
            <header class="header">
                <h1>Sua Galeria</h1>
                <p>Imagens enviadas recentemente</p>
            </header>

            <div id="gallery-loader" class="loader hidden">
                <i class="ph ph-spinner-gap spin"></i>
                <span>Carregando galeria...</span>
            </div>

            <div id="gallery-grid" class="gallery-grid">
                <!-- Cards injetados via JS -->
            </div>
            
            <div id="empty-state" class="empty-state hidden">
                <i class="ph ph-images"></i>
                <p>Nenhuma imagem na galeria ainda.</p>
            </div>
        </section>

        <!-- Toast Notifications -->
        <div id="toast" class="toast"></div>

    </main>

    <script src="script.js"></script>
</body>
</html>
